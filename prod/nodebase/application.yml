apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodebase
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/IshankSharma2178/nodebase-ops.git
    targetRevision: main
    path: prod/nodebase
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
