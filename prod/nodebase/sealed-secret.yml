# Replace this file by running: ./scripts/seal-secret.sh prod
#
# Do NOT commit plaintext secrets. After sealing, this file should contain
# encryptedData entries generated by kubeseal.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nodebase-secret
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
spec:
  encryptedData:
    .env: REPLACE_ME_RUN_scripts/seal-secret.sh
  template:
    metadata:
      name: nodebase-secret
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
    type: Opaque
