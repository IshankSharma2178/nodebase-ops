apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodebase
  labels:
    app: nodebase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodebase
  template:
    metadata:
      labels:
        app: nodebase
    spec:
      containers:
        - name: nodebase
          image: 916785371700.dkr.ecr.us-east-1.amazonaws.com/nodebase:REPLACE_WITH_GIT_SHA
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: nodebase-secret
          volumeMounts:
            - name: secret
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: secret
          secret:
            secretName: nodebase-secret
            items:
              - key: .env
                path: .env
