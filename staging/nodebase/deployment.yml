apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodebase-staging
  labels:
    app: nodebase-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodebase-staging
  template:
    metadata:
      labels:
        app: nodebase-staging
    spec:
      containers:
        - name: nodebase-staging
          image: 916785371700.dkr.ecr.us-east-1.amazonaws.com/nodebase:REPLACE_WITH_GIT_SHA
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: nodebase-staging-secret
          volumeMounts:
            - name: secret
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secret
          secret:
            secretName: nodebase-staging-secret
            items:
              - key: .env
                path: .env
